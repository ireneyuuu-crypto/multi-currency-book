<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>旅行账本</title>
<meta name="description" content="多币种旅行记账 · 按消费日历史汇率折算人民币" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#FAF6F1" />
<!-- iOS 添加到主屏幕 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="旅行账本" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

<!-- 依赖（首次联网加载，Service Worker 缓存后离线可用） -->
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<!-- 关键垫片：lucide-react UMD 读取的是小写全局 react（实测其包装为 d(a.LucideReact={}, a.react)） -->
<script>window.react = window.React;</script>
<script crossorigin src="https://unpkg.com/lucide-react@0.436.0/dist/umd/lucide-react.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; width: 100%; background: #EBEBEE; touch-action: manipulation; }
  #root { height: 100%; overflow: hidden; }
  /* 启动占位（React 渲染后自动替换 #root 内容） */
  .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; color: #8E8E93; }
  .boot-icon { width: 64px; height: 64px; border-radius: 16px; background: #FF4F62; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 30px; font-weight: 800; }
  .boot-spin { width: 18px; height: 18px; border: 2.5px solid #E5E0DA; border-top-color: #FF4F62; border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
<script>
/* iOS 独立模式安全区兜底：部分 iOS 版本在 PWA 里 env(safe-area-inset-*) 返回 0，
   探测到该情况时按机型高度估算并写入 CSS 变量（应用内所有安全区 padding 都读取该变量）。 */
(function () {
  var standalone = (navigator.standalone === true) || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (!standalone) return;
  function apply() {
    try {
      var probe = document.createElement("div");
      probe.style.cssText = "position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;height:env(safe-area-inset-top,0px)";
      document.body.appendChild(probe);
      var h = probe.getBoundingClientRect().height;
      probe.remove();
      if (h >= 20) return; // env() 正常，无需兜底
      var sh = Math.max(screen.height, screen.width);
      var top = sh >= 852 ? 59 : (sh >= 812 ? 47 : 20);   // 灵动岛 / 刘海 / 传统
      var bottom = sh >= 812 ? 34 : 0;                     // Home 指示条
      var r = document.documentElement.style;
      r.setProperty("--safe-top", top + "px");
      r.setProperty("--safe-bottom", bottom + "px");
    } catch (e) { }
  }
  if (document.body) apply(); else window.addEventListener("DOMContentLoaded", apply);
})();
</script>
</head>
<body>
<div id="root">
  <div class="boot">
    <div class="boot-icon">¥</div>
    <div class="boot-spin"></div>
    <div style="font-size:13px">正在加载旅行账本…</div>
  </div>
</div>

<!-- 应用主体（Babel 浏览器端转译 JSX；SW 缓存后离线可用） -->
<script type="text/babel" data-presets="react" src="./app.jsx"></script>

<script>
  // 注册 Service Worker（离线缓存 + 历史汇率缓存）
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
